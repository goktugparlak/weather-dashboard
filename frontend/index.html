<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple dashboard for current weather around the world.">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">A LOOK OUTSIDE</p>
            <h1>Weather Dashboard</h1>
            <p class="intro">Current conditions, wherever you're headed.</p>
        </header>
        <form id="search-form" novalidate>
            <label for="city-input">City</label>
            <div class="search-controls">
                <input type="text" id="city-input" name="city" placeholder="Try Torino,IT"
                    autocomplete="off" required maxlength="100" aria-describedby="search-hint">
                <button type="submit" id="search-button">Search</button>
            </div>
            <p id="search-hint" class="hint">Add a country code for a more precise search, such as Hamburg,DE.</p>
        </form>
        <section id="weather-result" aria-live="polite" aria-atomic="true" aria-busy="false">
            <p class="empty-message">Enter a city to see its current weather.</p>
        </section>
        <footer>Weather data from OpenWeather · °C · wind in m/s</footer>
    </main>
</body>
</html>
